<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <link rel="stylesheet" href="./styles.css"/>
        <title>Edit Work - Confused Fitness</title>
    </head>
    <body>

      <header class="top">
        <div class="brand">
          <div class="mark">CF</div>
          <div>
            <h1>Confused Fitness</h1>
            <p>CONFUSED.INC</p>
          </div>
        </div>
        <div class="topR">
          <button class="btnLog" id="logBtn">Log</button>
          <div class="rib" id="rib">🔥 0 Day Streak</div>
        </div>
      </header>

      <div class="lay">

        <aside class="side">
          <a href="homepage.html">Home</a>
          <a href="favs.html">Favorites</a>
          <a href="add work.html">Add Work</a>
          <a href="edit work.html" class="on">Edit Work</a>
          <a href="cal.html">Calendar</a>
          <a href="account.html">Account</a>
          <a href="set.html">Settings</a>
        </aside>

        <main class="ewMain">

          <aside class="ewL">
            <input type="text" class="sch" id="sch" placeholder="search..."/>
            <div class="ewList" id="lst"></div>
          </aside>

          <section class="ewR" id="ewR">

            <div class="ewHd">
              <div class="ewLogo" id="ewLogo">?</div>
              <div class="ewMeta">
                <div class="ewName" id="ewN">pick something on the left</div>
                <div class="ewChips" id="ewC"></div>
              </div>
            </div>

            <div class="ewDsc">
              <div class="lab">Description</div>
              <div class="ewDtx" id="ewDt">— select an exercise to view details —</div>
            </div>

            <div class="ewLog">
              <div class="lab">Today's Log</div>
              <div class="logRow">
                <div class="logI"><div class="logL">sets</div><input type="number" class="inp logN" id="lgS" min="0" value=""/></div>
                <div class="logI"><div class="logL">reps</div><input type="number" class="inp logN" id="lgR" min="0" value=""/></div>
                <div class="logI"><div class="logL">weight (lb)</div><input type="number" class="inp logN" id="lgW" min="0" step="2.5" value=""/></div>
                <button class="btnAdd" id="lgSave" disabled>Save Log</button>
              </div>
              <div class="logHist" id="lgH"></div>
            </div>

            <div class="ewActs">
              <button class="btnGh" id="actEd" disabled>Edit Exercise</button>
              <button class="btnGh" id="actDel" disabled>Delete</button>
            </div>

          </section>

        </main>
      </div>

      <!-- edit modal -->
      <div class="mdW" id="edW">
        <div class="md">
          <div class="mdH">
            <div class="lab">Edit Exercise</div>
            <button class="mdX" id="edX">×</button>
          </div>
          <div class="mdB">
            <input type="text" class="inp" id="eN" placeholder="name"/>
            <select class="inp" id="eMu">
              <option value="chest">chest</option><option value="back">back</option>
              <option value="legs">legs</option><option value="shoulders">shoulders</option>
              <option value="arms">arms</option><option value="core">core</option>
            </select>
            <select class="inp" id="eEq">
              <option value="barbell">barbell</option><option value="dumbbell">dumbbell</option>
              <option value="cable">cable</option><option value="bodyweight">bodyweight</option>
              <option value="machine">machine</option>
            </select>
            <textarea class="inp tA" id="eDs"></textarea>
          </div>
          <div class="mdF">
            <button class="btnGh" id="edC">Cancel</button>
            <button class="btnAdd" id="edS">Save</button>
          </div>
        </div>
      </div>

      <script>
        $(function () {
          const LS = 'cf_ex'; const LG = 'cf_log';
          let all = []; let q = ''; let cur = null;

          function load() {
            $.getJSON('exercises.json', function (data) {
              const base = data.exercises;
              const stored = JSON.parse(localStorage.getItem(LS) || '{}');
              const customs = stored.custom || []; const edits = stored.edits || {};
              all = base.map(function (x) { return edits[x.id] ? Object.assign({}, x, edits[x.id]) : x; }).filter(function (x) { return !x._deleted; });
              all = all.concat(customs);
              renderList(); if (cur) { const fresh = all.find(function (x) { return x.id === cur.id; }); if (fresh) showDetail(fresh); else clearDetail(); }
            }).fail(function () {
              const stored = JSON.parse(localStorage.getItem(LS) || '{}');
              all = stored.custom || []; renderList();
            });
          }

          function save(customs, edits) {
            const cs = JSON.parse(localStorage.getItem(LS) || '{}');
            if (customs) cs.custom = customs; if (edits) cs.edits = edits;
            localStorage.setItem(LS, JSON.stringify(cs));
          }

          function renderList() {
            const $l = $('#lst').empty();
            const fil = all.filter(function (x) { return !q || x.name.toLowerCase().indexOf(q) !== -1; });
            if (!fil.length) { $l.append('<div class="empty sm">nothing matches</div>'); return; }
            fil.forEach(function (x) {
              const it = $('<div class="lItm" data-id="'+x.id+'"></div>');
              if (cur && cur.id === x.id) it.addClass('act');
              it.append('<div class="lN">'+x.name+'</div>');
              it.append('<div class="lM">'+x.muscle+' · '+x.equipment+'</div>');
              $l.append(it);
            });
          }

          function showDetail(x) {
            cur = x;
            $('#ewN').text(x.name);
            $('#ewLogo').text(x.name.charAt(0).toUpperCase());
            $('#ewC').empty().append('<span class="ch mu">'+x.muscle+'</span><span class="ch eq">'+x.equipment+'</span>');
            $('#ewDt').text(x.description);
            $('#actEd, #actDel, #lgSave').prop('disabled', false);
            $('#lst .lItm').removeClass('act'); $('#lst .lItm[data-id="'+x.id+'"]').addClass('act');
            renderLog();
          }

          function clearDetail() {
            cur = null;
            $('#ewN').text('pick something on the left'); $('#ewLogo').text('?');
            $('#ewC').empty(); $('#ewDt').text('— select an exercise to view details —');
            $('#actEd, #actDel, #lgSave').prop('disabled', true);
            $('#lgH').empty();
          }

          function renderLog() {
            const logs = JSON.parse(localStorage.getItem(LG) || '{}');
            const arr = (logs[cur.id] || []).slice().reverse();
            const $h = $('#lgH').empty();
            if (!arr.length) { $h.append('<div class="empty sm">no logs yet for this one.</div>'); return; }
            arr.slice(0, 8).forEach(function (e) {
              const d = new Date(e.t); const ds = (d.getMonth()+1)+'/'+d.getDate();
              $h.append('<div class="lgE"><span class="lgD">'+ds+'</span><span class="lgV">'+e.s+' × '+e.r+'</span><span class="lgW">'+e.w+' lb</span></div>');
            });
          }

          // search
          $('#sch').on('input', function () { q = this.value.toLowerCase().trim(); renderList(); });

          // pick item
          $(document).on('click', '.lItm', function () {
            const id = parseInt($(this).data('id'), 10);
            const x = all.find(function (a) { return a.id === id; }); if (x) showDetail(x);
          });

          // log save
          $('#lgSave').on('click', function () {
            if (!cur) return;
            const s = parseInt($('#lgS').val(), 10); const r = parseInt($('#lgR').val(), 10); const w = parseFloat($('#lgW').val());
            if (!s || !r) { alert('sets and reps required'); return; }
            const logs = JSON.parse(localStorage.getItem(LG) || '{}');
            if (!logs[cur.id]) logs[cur.id] = [];
            logs[cur.id].push({ s: s, r: r, w: isNaN(w) ? 0 : w, t: Date.now() });
            localStorage.setItem(LG, JSON.stringify(logs));
            $('#lgS,#lgR,#lgW').val(''); renderLog();
          });

          // edit modal
          $('#actEd').on('click', function () {
            if (!cur) return;
            $('#eN').val(cur.name); $('#eMu').val(cur.muscle); $('#eEq').val(cur.equipment); $('#eDs').val(cur.description);
            $('#edW').addClass('o');
          });
          $('#edX, #edC').on('click', function () { $('#edW').removeClass('o'); });
          $('#edS').on('click', function () {
            const stored = JSON.parse(localStorage.getItem(LS) || '{}');
            const customs = stored.custom || []; const edits = stored.edits || {};
            const upd = { name: $('#eN').val().trim(), muscle: $('#eMu').val(), equipment: $('#eEq').val(), description: $('#eDs').val().trim() };
            if (cur.id >= 1000) {
              const i = customs.findIndex(function (c) { return c.id === cur.id; });
              if (i !== -1) customs[i] = Object.assign(customs[i], upd);
            } else { edits[cur.id] = upd; }
            save(customs, edits); $('#edW').removeClass('o'); load();
          });

          // delete
          $('#actDel').on('click', function () {
            if (!cur) return;
            if (!confirm('delete "'+cur.name+'"? this also clears its logs.')) return;
            const stored = JSON.parse(localStorage.getItem(LS) || '{}');
            const customs = stored.custom || []; const edits = stored.edits || {};
            if (cur.id >= 1000) {
              const i = customs.findIndex(function (c) { return c.id === cur.id; });
              if (i !== -1) customs.splice(i, 1);
            } else { edits[cur.id] = { _deleted: true }; }
            const logs = JSON.parse(localStorage.getItem(LG) || '{}'); delete logs[cur.id]; localStorage.setItem(LG, JSON.stringify(logs));
            save(customs, edits); cur = null; load(); clearDetail();
          });

          $('#logBtn').on('click', function () { window.location.href = 'login.html'; });

          const s = parseInt(localStorage.getItem('cf_streak') || '0', 10);
          $('#rib').html('🔥 ' + s + ' Day Streak');

          load();
        });
      </script>

    </body>
</html>
