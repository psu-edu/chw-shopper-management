<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./styles.css"/>
        <title>Add Item - Confused Hardware</title>
    </head>
    <body>

      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
          <a class="navbar-brand fw-semibold" href="Homepage.html">Confused Hardware</a>
          <div class="navbar-nav ms-auto">
            <a class="nav-link" href="Homepage.html">Home</a>
            <a class="nav-link" href="Shopping.html">Shop</a>
            <a class="nav-link" href="product-mang.html">Product Management</a>
            <a class="nav-link active" aria-current="page" href="add-item.html">Add Item</a>
            <a class="nav-link" href="Register.html">Shopper Signup</a>
          </div>
        </div>
      </nav>

      <div class="container mt-5">
        <div class="card p-4 shadow">
          <h3 class="text-center mb-4">Add New Product</h3>

          <form id="productForm" class="needs-validation" novalidate autocomplete="off">
            <div class="row">

              <div class="col-md-6">
                <div class="mb-3">
                  <input type="text" class="form-control" id="productId" placeholder="Product ID" required>
                  <div class="invalid-feedback">BRO WHAT IS IT CALLED</div>
                </div>
                <div class="mb-3">
                  <input type="text" class="form-control" id="productDescription" placeholder="Product Description" required>
                  <div class="invalid-feedback">Patrick Star?</div>
                </div>
                <div class="mb-3">
                  <input type="text" class="form-control" id="productCategory" placeholder="Product Category" required>
                  <div class="invalid-feedback">INTRIODUCING Choclate starfish and hotdog flavored water</div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="mb-3">
                  <input type="text" class="form-control" id="productUOM" placeholder="Unit of Measure (e.g. each, kg, box)" required>
                  <div class="invalid-feedback">each? kg? box?</div>
                </div>
                <div class="mb-3">
                  <input type="number" class="form-control" id="productPrice" placeholder="Price ($)" min="0" step="0.01" required>
                  <div class="invalid-feedback">free 99</div>
                </div>
                <div class="mb-3">
                  <input type="number" class="form-control" id="productWeight" placeholder="Weight (kg) - optional" min="0" step="0.01">
                  <div class="invalid-feedback">yes anti-matter</div>
                </div>
              </div>

            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-dark">Save Product</button>
              <button type="button" class="btn btn-outline-secondary" id="clearBtn">Clear</button>
              <a href="product-mang.html" class="btn btn-outline-dark ms-auto">Go to Product Management →</a>
            </div>
          </form>

          <div id="successMsg" class="alert alert-success mt-3 d-none"></div>
          <div id="errorMsg"   class="alert alert-warning mt-3 d-none"></div>
        </div>

        <div class="text-muted small mt-3" id="dataSourceNote"></div>
      </div>

      <script>
        $(function () {
          const STORAGE_KEY = 'productData'; const INIT_FLAG = 'productDataInitialized';

          function ensureDataLoaded(callback) {
            if (localStorage.getItem(INIT_FLAG) === 'true') { callback(); return; }
            $.getJSON('data.json')
              .done(function (json) { localStorage.setItem(STORAGE_KEY, JSON.stringify(json)); localStorage.setItem(INIT_FLAG, 'true'); $('#dataSourceNote').text('Products initialized from data.json. New items are saved in your browser.'); callback(); })
              .fail(function () { localStorage.setItem(STORAGE_KEY, JSON.stringify({ Products: [] })); localStorage.setItem(INIT_FLAG, 'true'); $('#dataSourceNote').text('Could not load data.json. Starting with an empty product list.'); callback(); });
          }

          function loadProducts() { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : { Products: [] }; }
          function saveProducts(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

          function showSuccess(message) { $('#errorMsg').addClass('d-none'); $('#successMsg').text(message).removeClass('d-none'); setTimeout(function () { $('#successMsg').addClass('d-none'); }, 3000); }
          function showError(message) { $('#successMsg').addClass('d-none'); $('#errorMsg').text(message).removeClass('d-none'); }

          $('#productForm').on('submit', function (event) {
            event.preventDefault(); const form = this;

            const priceVal = parseFloat($('#productPrice').val());
            if ($('#productPrice').val() === '' || priceVal === 0) { event.stopPropagation(); $(form).addClass('was-validated'); $('#productPrice')[0].setCustomValidity('invalid'); return; } else { $('#productPrice')[0].setCustomValidity(''); }

            const weightRaw = $('#productWeight').val();
            if (weightRaw !== '' && parseFloat(weightRaw) === 0) { event.stopPropagation(); $(form).addClass('was-validated'); $('#productWeight')[0].setCustomValidity('invalid'); return; } else { $('#productWeight')[0].setCustomValidity(''); }

            if (!form.checkValidity()) { event.stopPropagation(); $(form).addClass('was-validated'); return; }

            const product = { productId: $('#productId').val().trim(), productDescription: $('#productDescription').val().trim(), productCategory: $('#productCategory').val().trim(), productUOM: $('#productUOM').val().trim(), productPrice: priceVal, productWeight: weightRaw !== '' ? parseFloat(weightRaw) : null };

            const data = loadProducts();
            const dup = data.Products.some(function (p) { return String(p.productId).toLowerCase() === product.productId.toLowerCase(); });
            if (dup) { showError('A product with ID "' + product.productId + '" already exists. Go to Product Management to edit it.'); return; }

            data.Products.push(product); saveProducts(data); showSuccess('Product "' + product.productId + '" added.'); form.reset(); $(form).removeClass('was-validated');
          });

          $('#clearBtn').on('click', function () { $('#productForm')[0].reset(); $('#productForm').removeClass('was-validated'); $('#successMsg, #errorMsg').addClass('d-none'); });

          ensureDataLoaded(function () {});
        });
      </script>

    </body>
</html>
