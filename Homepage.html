<div class="container mt-5">
  <div class="card p-4 shadow">
    <h3 class="text-center mb-3">Shopper Welcome</h3>

    <div id="displayArea" class="text-center">
        <p>Welcome, <strong id="displayName">Guest</strong>!</p>
        <p id="displayEmail"></p>
        <p id="displayAddress"></p>
    </div>
  </div>
</div>

<script>
    function getCustomerField(data, key) { if (!data || !Array.isArray(data.Customer)) return null; const entry = data.Customer.find(function (o) { return Object.prototype.hasOwnProperty.call(o, key); }); return entry ? entry[key] : null; }

    const uData = localStorage.getItem('userData');
    if (uData) {
        try {
            const data = JSON.parse(uData); const name = getCustomerField(data, 'name'); const email = getCustomerField(data, 'email'); const address = getCustomerField(data, 'address');

            if (name) document.getElementById('displayName').innerText = name;
            if (email) document.getElementById('displayEmail').innerText = "Email: " + email;
            if (address) document.getElementById('displayAddress').innerText = "Shipping to: " + address;
        } catch (e) { console.error('Could not parse userData from localStorage:', e); }
    }
</script>

<script src="scripts.js"></script>
